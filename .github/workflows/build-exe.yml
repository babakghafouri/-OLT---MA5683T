name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "OLT-MA5683T-EMU-Fan-Fixed.zip"
      - "traffic-live.patch.gz.b64"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract baseline ZIP and apply live traffic patch
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "OLT-MA5683T-EMU-Fan-Fixed.zip"
          if (!(Test-Path $zip)) {
            throw "Missing OLT-MA5683T-EMU-Fan-Fixed.zip in repository root."
          }

          $dest = Join-Path $env:GITHUB_WORKSPACE "build-source"
          if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

          $patchB64Path = Join-Path $env:GITHUB_WORKSPACE "traffic-live.patch.gz.b64"
          if (!(Test-Path $patchB64Path)) {
            throw "Missing compressed live traffic patch."
          }
          $patchBytes = [Convert]::FromBase64String((Get-Content -LiteralPath $patchB64Path -Raw).Trim())
          $gzipPath = Join-Path $env:RUNNER_TEMP "traffic-live.patch.gz"
          [IO.File]::WriteAllBytes($gzipPath, $patchBytes)

          $env:PATCH_GZ = $gzipPath
          $env:PATCH_OUT = Join-Path $env:RUNNER_TEMP "traffic-live.patch"
          python -c "import os,gzip,pathlib; pathlib.Path(os.environ['PATCH_OUT']).write_bytes(gzip.decompress(pathlib.Path(os.environ['PATCH_GZ']).read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw "Could not decompress live traffic patch." }

          git -C $env:GITHUB_WORKSPACE apply --check --directory=build-source $env:PATCH_OUT
          if ($LASTEXITCODE -ne 0) { throw "Live traffic patch check failed." }
          git -C $env:GITHUB_WORKSPACE apply --directory=build-source $env:PATCH_OUT
          if ($LASTEXITCODE -ne 0) { throw "Could not apply live traffic patch." }

          $src = Join-Path $dest "OLT-MA5683T-Operator-Dashboard"
          foreach ($required in @("app.py", "index.html", "services.json", "requirements.txt")) {
            if (!(Test-Path (Join-Path $src $required))) {
              throw "Required source file missing after extraction: $required"
            }
          }
          python -m py_compile (Join-Path $src "app.py")
          if ($LASTEXITCODE -ne 0) { throw "Python syntax validation failed." }
          "OLT_SOURCE_DIR=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:OLT_SOURCE_DIR\requirements.txt" "pyinstaller>=6.10"

      - name: Build EXE
        shell: pwsh
        run: |
          Set-Location $env:OLT_SOURCE_DIR
          python -m PyInstaller --noconfirm --clean --onefile --name OLT-MA5683T-Panel --add-data "index.html;." --add-data "services.json;." --collect-all flask --collect-all paramiko --collect-all cryptography --collect-all bcrypt --collect-all nacl app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLT-MA5683T-Panel-Windows
          path: ${{ env.OLT_SOURCE_DIR }}\\dist\\OLT-MA5683T-Panel.exe
          if-no-files-found: error
          retention-days: 30
