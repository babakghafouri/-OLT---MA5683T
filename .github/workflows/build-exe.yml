name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract project ZIP
        shell: pwsh
        run: |
          $preferred = Join-Path $env:GITHUB_WORKSPACE "OLT-MA5683T-Windows-EXE-Build-Kit.zip"
          if (Test-Path $preferred) {
            $zip = $preferred
          } else {
            $candidates = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File -Filter "*.zip" |
              Sort-Object Name)
            if ($candidates.Count -eq 0) {
              throw "No ZIP file found in the repository root. Upload the project ZIP first."
            }
            if ($candidates.Count -gt 1) {
              Write-Host "Multiple ZIP files found:"
              $candidates | ForEach-Object { Write-Host " - $($_.Name)" }
              $candidate = $candidates | Where-Object { $_.Name -eq "OLT-MA5683T-EMU-Fan-Fixed.zip" } | Select-Object -First 1
              if (!$candidate) {
                throw "Multiple ZIP files found and no preferred project archive was identified."
              }
              $zip = $candidate.FullName
            } else {
              $zip = $candidates[0].FullName
            }
          }

          Write-Host "Using archive: $(Split-Path $zip -Leaf)"
          $dest = Join-Path $env:RUNNER_TEMP "olt-build-kit"
          if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

          $app = Get-ChildItem -LiteralPath $dest -Recurse -File -Filter "app.py" | Select-Object -First 1
          if (!$app) {
            Write-Host "Archive files found (first 100):"
            Get-ChildItem -LiteralPath $dest -Recurse -File | Select-Object -First 100 -ExpandProperty FullName | ForEach-Object { Write-Host $_ }
            throw "app.py was not found in the uploaded ZIP. This archive may not be the Python/Flask build kit."
          }

          $src = $app.Directory.FullName
          foreach ($required in @("index.html", "services.json", "requirements.txt")) {
            if (!(Test-Path (Join-Path $src $required))) {
              Write-Host "Files beside app.py:"
              Get-ChildItem -LiteralPath $src -File | ForEach-Object { Write-Host $_.Name }
              throw "Required file missing beside app.py: $required"
            }
          }
          "OLT_SOURCE_DIR=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:OLT_SOURCE_DIR\requirements.txt" "pyinstaller>=6.10"

      - name: Build EXE
        shell: pwsh
        run: |
          Set-Location $env:OLT_SOURCE_DIR
          python -m PyInstaller --noconfirm --clean --onefile --name OLT-MA5683T-Panel --add-data "index.html;." --add-data "services.json;." --collect-all flask --collect-all paramiko --collect-all cryptography --collect-all bcrypt --collect-all nacl app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLT-MA5683T-Panel-Windows
          path: ${{ env.OLT_SOURCE_DIR }}\dist\OLT-MA5683T-Panel.exe
          if-no-files-found: error
          retention-days: 30
