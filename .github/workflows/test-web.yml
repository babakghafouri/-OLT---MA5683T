name: Validate web application

on:
  push:
    branches: [web-multi-olt]
    paths:
      - "web-source/**"
      - ".github/workflows/test-web.yml"
  pull_request:
    branches: [web-multi-olt]
    paths:
      - "web-source/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web-source/requirements.txt
      - name: Compile Python
        run: python -m py_compile web-source/app.py web-source/ont_details.py
      - name: Run chassis inventory unit tests
        run: python -m unittest discover -s web-source -p 'test_*.py' -v
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ("index.html", "management.html"):
              html = Path("web-source", name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              assert scripts, f"No inline script found in {name}"
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/management.html.js
